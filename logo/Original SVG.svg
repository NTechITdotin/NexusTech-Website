<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">

  <!-- Logo Mark: The "Ascending N Monolith" -->
  <g transform="translate(80, 80)">
    <!-- Left Pillar -->
    <path d="M 0 150 L 0 50 L 40 10 Z" fill="#D4AF37" />
    <!-- Diagonal Upward Metric -->
    <path d="M 40 150 L 40 50 L 100 110 L 100 150 Z" fill="#E2E8F0" />
    <!-- Right Pillar (Building What's Next) -->
    <path d="M 100 150 L 100 10 L 140 10 L 140 150 Z" fill="#D4AF37" />
  </g>

  <!-- Typography: NOBTECH -->
  <text x="260" y="150" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    NOBTECH
  </text>

  <!-- Typography: IT SERVICES -->
  <text x="265" y="195" font-family="'Inter', 'Arial', sans-serif" font-size="24" font-weight="600" fill="#E2E8F0" letter-spacing="12">
    IT SERVICES
  </text>

  <!-- Divider Line -->
  <line x1="265" y1="230" x2="720" y2="230" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>

  <!-- Typography: Tagline -->
  <text x="265" y="265" font-family="'Inter', 'Arial', sans-serif" font-size="18" font-weight="300" fill="#A0AEC0" letter-spacing="6" font-style="italic">
    BUILDING WHAT'S NEXT !
  </text>
</svg>
